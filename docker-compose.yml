services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frames
      POSTGRES_PASSWORD: frames
      POSTGRES_DB: frames
    ports:
      - "5432:5432"
    volumes:
      - frames-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @frames/api prisma:generate && pnpm --filter @frames/api dev"
    ports:
      - "3001:3001"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://frames:frames@postgres:5432/frames
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
    depends_on:
      - postgres
      - redis

  worker:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @frames/worker dev"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://frames:frames@postgres:5432/frames
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
    depends_on:
      - postgres
      - redis

volumes:
  frames-postgres:
