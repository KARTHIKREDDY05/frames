<style>
        body { 
            background-color: theme('colors.paper-cream'); 
            color: theme('colors.electric-ink'); 
            min-height: max(884px, 100dvh);
            position: relative;
        }
        /* Paper Grain Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            opacity: 0.6;
            pointer-events: none;
            z-index: -1;
        }

        .hard-shadow { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        
        .washi-tape {
            position: absolute;
            width: 70px;
            height: 20px;
            background-color: theme('colors.soft-lavender');
            opacity: 0.85;
            z-index: 10;
            border: 1px solid theme('colors.electric-ink');
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Torn edge effect */
        .torn-edge {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 95%, 90% 100%, 85% 96%, 80% 100%, 75% 95%, 70% 100%, 65% 94%, 60% 100%, 55% 97%, 50% 100%, 45% 95%, 40% 100%, 35% 96%, 30% 100%, 25% 94%, 20% 100%, 15% 95%, 10% 100%, 5% 96%, 0 100%);
        }

        /* Hand-drawn icon feel */
        .stamped-icon {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 200, 'opsz' 24;
            opacity: 0.8;
            filter: url(#rough-edge); /* Optional SVG filter for roughness if added */
        }
    </style>
