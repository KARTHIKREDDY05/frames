<body class="bg-paper-cream text-electric-ink font-body-md selection:bg-acid-yellow selection:text-electric-ink min-h-screen flex items-center justify-center overflow-x-hidden relative">
<!-- Decorative Washi Tape -->
<div class="fixed top-12 left-8 w-24 h-6 bg-soft-lavender opacity-60 -rotate-[12deg] mix-blend-multiply pointer-events-none z-0"></div>
<div class="fixed bottom-20 right-10 w-32 h-8 bg-acid-yellow opacity-40 rotate-[5deg] mix-blend-multiply pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-mobile md:px-margin-desktop relative z-10">
<!-- App Brand Stamped -->
<div class="mb-stack-loose text-center md:text-left flex items-center justify-center md:justify-start gap-2">
<span class="material-symbols-outlined text-electric-ink text-4xl" style="font-variation-settings: 'FILL' 1;">token</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg uppercase tracking-tighter">Frames</span>
</div>
<!-- Scrapbook 'Card' Container -->
<div class="relative bg-paper-cream border border-electric-ink p-6 md:p-8 transform rotate-1 hover:rotate-0 transition-transform duration-300">
<!-- Corner Sticker Accent -->
<div class="absolute -top-3 -right-3 w-8 h-8 bg-soft-lavender border border-electric-ink shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center -rotate-[15deg]">
<span class="material-symbols-outlined text-sm">asterisk</span>
</div>
<!-- Headers -->
<div class="mb-8">
<h1 class="font-display-lg text-display-lg uppercase leading-none break-words hyphens-auto">WELCOME<br/>BACK</h1>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-loose" method="POST">
<div class="flex flex-col gap-4">
<!-- Email Input -->
<div class="relative w-full border border-electric-ink bg-paper-cream focus-within:bg-soft-lavender/30 focus-within:border-[2px] transition-all group pt-2 px-3 pb-1">
<label class="absolute top-1 left-2 font-label-caps text-label-caps text-secondary uppercase" for="email">Email Address</label>
<input class="w-full bg-transparent border-none p-0 mt-3 font-body-lg text-body-lg text-electric-ink focus:ring-0 placeholder:text-secondary/50 placeholder:font-body-md" id="email" name="email" placeholder="you@domain.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative w-full border border-electric-ink bg-paper-cream focus-within:bg-soft-lavender/30 focus-within:border-[2px] transition-all group pt-2 px-3 pb-1">
<label class="absolute top-1 left-2 font-label-caps text-label-caps text-secondary uppercase" for="password">Password</label>
<input class="w-full bg-transparent border-none p-0 mt-3 font-body-lg text-body-lg text-electric-ink focus:ring-0 placeholder:text-secondary/50 placeholder:font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-acid-yellow border border-electric-ink shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] py-4 font-label-caps text-label-caps uppercase text-electric-ink hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all cursor-pointer" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex py-6 items-center">
<div class="flex-grow border-t border-electric-ink"></div>
<span class="flex-shrink-0 mx-4 font-label-caps text-label-caps text-secondary uppercase">OR</span>
<div class="flex-grow border-t border-electric-ink"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-paper-cream border border-electric-ink py-4 px-4 font-label-caps text-label-caps uppercase text-electric-ink flex items-center justify-center gap-3 hover:bg-surface-dim transition-colors cursor-pointer group" type="button">
<span class="material-symbols-outlined text-lg group-hover:-rotate-12 transition-transform">globe</span>
                Continue with Google
            </button>
</div>
<!-- Footer Stamped Meta -->
<div class="mt-8 text-center">
<a class="font-metadata-stamped text-metadata-stamped uppercase text-secondary hover:text-electric-ink hover:underline decoration-2 underline-offset-4 transition-colors" href="#">
                New to Frames? Create an account
            </a>
</div>
</main>
